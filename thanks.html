<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanks</title><meta name="robots" content="noindex">
<style>body{margin:0;padding:24px;font:600 16px "Figtree","Segoe UI",system-ui,sans-serif;color:#0d3b55}</style></head>
<body><p>Thanks. Your sticker is on its way.</p>
<script>
/* Set this page as the redirect in the Pipedrive form. It reports the submission to the quiz, framed or not. */
if(window.parent!==window){ try{ window.parent.postMessage("ec_form_submit",location.origin); }catch(e){} }
else {
  var k=null; try{ k=localStorage.getItem("ec_result"); }catch(e){}
  location.replace(k ? "./?r="+k+"&sent=1" : "./");
}
</script></body></html>
