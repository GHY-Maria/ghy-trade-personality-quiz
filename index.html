.top .div{width:1px;height:30px;background:var(--line)}
.top small{font-size:.8rem;line-height:1.25;color:var(--ink-2)}
.top .tm small{display:block;font-size:.92em;letter-spacing:.02em;text-transform:none;font-weight:500;color:var(--ink-2);margin-top:2px}
.top .tm{font-size:.8rem;line-height:1.25;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600}

.btn{text-decoration:none;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:8px;padding:14px 26px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem}
.btn-gold{background:var(--gold);color:var(--on-gold)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);letter-spacing:.04em;text-transform:none;padding:10px 18px}
.btn-ghost:hover{border-color:var(--brand)}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}

/* landing */
.landing{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-block:28px 12px}
.landing > *{min-width:0}
.rule{width:56px;height:3px;background:var(--gold);margin:18px 0 22px}
.hero-h{font-size:clamp(2.1rem,5.2vw,3.6rem);font-weight:800;letter-spacing:-.02em;color:var(--brand-deep)}
.hero-h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;color:var(--brand);margin-top:10px}
:root[data-theme="dark"] .hero-h{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-h{color:var(--ink)}}
.lede{color:var(--ink-2);margin-top:18px;max-width:52ch}
.six{font-weight:700;color:var(--brand);font-size:1.15rem;margin-top:14px}
.cta-row{margin-top:26px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.fine{font-size:.9rem;color:var(--ink-2)}
@media (max-width:820px){.landing{grid-template-columns:1fr;gap:32px}}

/* classification-pending card: teases the record without showing an outcome */
.tmk{font-size:.42em;font-weight:600;letter-spacing:0;line-height:0;vertical-align:.95em;margin-left:.08em}
.pending{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 20px 50px -28px rgba(11,70,100,.4);transform:rotate(-1.6deg)}
.pending .rt{font-weight:800;color:var(--brand);letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;line-height:1.25;padding-bottom:12px;border-bottom:2px solid var(--gold)}
.pending dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:16px 0 0;align-items:center}
.pending dt{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.pending dd{margin:0;font-family:var(--f-mono);color:var(--ink);font-size:1.05rem;letter-spacing:.04em}

function renderQ(dir, first){
  const stage = document.getElementById("stage");
  const old = stage.firstElementChild;
  const el = document.createElement("div");
  el.innerHTML = cardHTML(idx);
  const card = el.firstElementChild;
  if(old && !first){
    old.className = old.className.replace(/slide-\S+/g,"") + (dir==="r" ? " slide-out-l" : " slide-out-r");
    setTimeout(()=>old.remove(), 330);
  }
  card.classList.add(dir==="r" ? "slide-in-r" : "slide-in-l");
  stage.appendChild(card);
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.j, b));
  document.getElementById("pc").textContent = `${idx+1} of ${Q.length}`;
  document.getElementById("pb").style.width = `${((idx+1)/Q.length)*100}%`;
  const back = document.getElementById("back");

  if(busy) return;

  btn.classList.add("on","flash");

    if(idx < Q.length-1){ idx++; renderQ("r"); top0(); }
    else {
      result = classify();

      setURL("?r="+P[result].key);
      track("quiz_complete",P[result].key);

function goBack(){

function classify(){
  const score = {C:0,M:0,K:0,S:0,V:0,F:0}, last = {};
  answers.forEach((a,i)=>{ if(a===null) return; const t = Q[i].o[a][0]; score[t]++; last[t]=i; });
  const max = Math.max(...Object.values(score));
  const tied = ORDER.filter(t=>score[t]===max);
  tied.sort((a,b)=>(last[b]??-1)-(last[a]??-1)); // tie: most recently chosen personality wins
  return tied[0];
}

      </table></div>
      <p class="sched-note">Base rates only. Chapter 99 additional duties are not shown. Confirm against the current HTS at hts.usitc.gov.</p>

      </div>
    </div>
    <div class="pi-grid">
      <div class="box pi-str"><h3>Strengths</h3>${ul(p.str)}</div>
      <div class="box pi-blind"><h3>Blind spots</h3>${ul(p.blind)}</div>

const JF_ID = "263125225446049";
const JF_URL = "https://form.jotform.com/" + JF_ID;

function stickerHTML(){
  return `<div class="jf-wrap" id="stickerform">
      <iframe id="JotFormIFrame-${JF_ID}" class="jf-frame" title="Sticker request form" src="${JF_URL}?isIframeEmbed=1" scrolling="no" allow="geolocation; microphone; camera; fullscreen"></iframe>
    </div>
    <p class="fine pd-fallback">Form not loading? <a href="${JF_URL}" target="_blank" rel="noopener">Open it in a new tab</a>.</p>`;
}

const showSent = () => {
  const s = document.getElementById("sticker");
  if(s) s.innerHTML = `<h2>Your sticker is on its way.</h2><p class="sent">Thanks. We have your details.</p>`;
};
function formSubmitted(key){
  const flag = "ec_sent_"+key;
  if(store.get("sessionStorage",flag)) return;
  store.set("sessionStorage",flag,"1");
  track("quiz_form_submit",key);
}
/* The sticker form is a cross-site frame. A click into it blurs this window, which is the form start.
   Submitting reloads the form's frame, which counts the submission (see wireForm). */
let formStarted = false;
addEventListener("blur",()=>setTimeout(()=>{
  const a = document.activeElement;
  if(!formStarted && result && a && a.tagName==="IFRAME" && a.closest("#stickerform")){ formStarted = true; track("quiz_form_start",P[result].key); }
},0));
addEventListener("message",e=>{
  if(e.origin===location.origin && e.data==="ec_form_submit" && result){ formSubmitted(P[result].key); showSent(); }
});

function wireForm(p){
  const f = document.getElementById("JotFormIFrame-"+JF_ID);
  if(!f) return;
  /* No inner scrollbar: the form tells the page its height and the frame grows to fit, step by step. */
  const fit = () => { if(window.jotformEmbedHandler) window.jotformEmbedHandler(`iframe[id='JotFormIFrame-${JF_ID}']`, "https://form.jotform.com/"); };
  const h = document.getElementById("jf-handler");
  if(window.jotformEmbedHandler) fit();
  else if(h) h.addEventListener("load", fit);
  else {
    const s = document.createElement("script");
    s.id = "jf-handler"; s.src = "https://cdn.jotfor.ms/s/umd/latest/for-form-embed-handler.js"; s.onload = fit;
    document.head.appendChild(s);
  }
  /* The frame reloads only when the form is submitted (its pages switch without reloading). */
  let loads = 0;
  f.addEventListener("load", () => { loads++; if(loads > 1) formSubmitted(p.key); });
}

/* Backup sizing, in case Jotform's helper script is blocked. */
addEventListener("message", e => {
  if(!/^https:\/\/(form\.)?jotform\.com$/.test(e.origin) || typeof e.data !== "string") return;
  const f = document.getElementById("JotFormIFrame-"+JF_ID); if(!f) return;
  const a = e.data.split(":");
  if(a[0]==="setHeight" && +a[1] > 0) f.style.height = (+a[1]) + "px";
  if(/submission-completed/.test(e.data) && result) formSubmitted(P[result].key);
});

function wireShare(p){
  const note = document.getElementById("sharenote");
  const say = m => { note.textContent = m; note.hidden = false; };
  const phone = matchMedia("(pointer:coarse)").matches && navigator.share;
  const short = n => n.replace("The ","");
  const a = short(p.name), t = P[p.tag];
  /* Tagged ghy.com link: GA4 reads it to count visits and new quiz starts from each share, by personality. */
  const tagged = src => `${QUIZ_URL}?ec=${p.key}&utm_source=${src}&utm_medium=quiz_share&utm_campaign=essential_character&utm_content=${p.key}`;
  const caption = `I was classified as ${p.name} (HTS ${p.hts}) in GHY's Essential Character™ Trade Personality Quiz.\n\nI'm a ${a}. Tag the ${short(t.name)} on your team.\n\nWhat's your trade personality? ${tagged("linkedin")}`;
  const subject = "What's your trade personality?";
  const intro = `I was classified as ${p.name} (HTS ${p.hts}) in GHY's Essential Character™ Trade Personality Quiz. What's yours?`;
  const plain = `${intro}\n\nTake the Essential Character Quiz: ${tagged("email")}`;

  /* Email graphic: the personality card, sized for an email body and embedded in the message itself. */
  let png = null, dataURL = "";
  fetch(`share/${p.key}.png`).then(r=>r.ok?r.blob():null).then(b=>{
    if(!b) return;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = 600; c.height = Math.round(600*img.height/img.width);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      dataURL = c.toDataURL("image/png");
      c.toBlob(x=>{ png = x; },"image/png");
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(b);
  }).catch(()=>{});
  const openEmail = body => {
    const l = document.createElement("a");
    l.href = "mailto:?subject="+encodeURIComponent(subject)+(body?"&body="+encodeURIComponent(body):"");
    document.body.appendChild(l); l.click(); l.remove();
  };

  /* LinkedIn: opens a post with the write-up and the quiz link. LinkedIn builds the preview card,
     including its image, from the ghy.com quiz page. No file is saved to the computer. */
  document.getElementById("sh").onclick = async () => {
    track("quiz_share",p.key,{share_method:"linkedin"});
    if(phone){
      try { await navigator.share({text:caption}); return; }
      catch(err){ if(err.name==="AbortError") return; }
    }
    window.open("https://www.linkedin.com/feed/?shareActive=true&text="+encodeURIComponent(caption),"_blank","noopener");
    say("LinkedIn is open with your post and the quiz link. The preview card appears below your text.");
  };

  /* Challenge your team: the email opens with the write-up and the tracked quiz link.
     One paste adds the graphic, linked to the same tracked link, above the signature. */
  document.getElementById("team").onclick = async () => {
    track("quiz_share",p.key,{share_method:"team"});
    if(phone && png){
      const file = new File([png],`essential-character-${p.key}.png`,{type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file],text:plain})){
        try { await navigator.share({files:[file],text:plain,title:subject}); return; }
        catch(err){ if(err.name==="AbortError") return; }
      }
    }
    /* An email opened from a web page can only hold plain text, so the graphic is copied, ready to paste. */
    const link = tagged("email");
    const html = dataURL ? `<p style="margin:0 0 12px"><a href="${link}"><img src="${dataURL}" width="600" alt="${p.name}, HTS ${p.hts}" style="display:block;width:600px;max-width:100%;height:auto;border:0"></a></p>` : "";
    let copied = false;
    if(html && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      try {
        await navigator.clipboard.write([new ClipboardItem({
          "text/html": new Blob([html],{type:"text/html"}),
          "image/png": png
        })]);
        copied = true;
      } catch(e){}
    }
    openEmail(plain+"\n\n");
    say(copied
      ? `Your email is open with the message and quiz link. Click at the end of it and press ${/Mac|iPhone|iPad/.test(navigator.platform)?"Cmd":"Ctrl"}+V to add your graphic above your signature.`
      : "Your email is open with the message and link.");
  };
}

  app.innerHTML = `

  <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;margin-top:8px">The six Essential Character<sup class="tmk">&trade;</sup> personalities</h1>

  <p class="disclaimer">Essential Character&trade; is a creative educational campaign by GHY International inspired by tariff classification. The personality result and associated HTSUS reference are illustrative and do not constitute a U.S. Customs and Border Protection (CBP) binding ruling, legal advice or a determination of the classification of any specific imported product.</p>`;
  app.querySelectorAll(".icard").forEach(b=>b.onclick=()=>showResult(b.dataset.t,true));

function boot(){
  const visit = keyToT(qs.get("v")), mine = keyToT(qs.get("r"));
  if(visit){
    const key = P[visit].key, src = qs.get("src") || "linkedin";
    ref = {personality:key, source:src};
    store.set("sessionStorage","ec_ref",JSON.stringify(ref));
    if(!store.get("sessionStorage","ec_visit_"+key)){
      store.set("sessionStorage","ec_visit_"+key,"1");
      track("quiz_shared_visit",key);
    }
    visitorPage(visit);
  } else if(mine){
    result = mine;
    showResult(mine);
    if(qs.get("sent")){ formSubmitted(P[mine].key); setURL("?r="+P[mine].key); showSent(); }
  } else landing();
}
boot();
booted = true;
</script>
