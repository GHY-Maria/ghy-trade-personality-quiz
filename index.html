.top .div{width:1px;height:30px;background:var(--line)}
.top small{font-size:.8rem;line-height:1.25;color:var(--ink-2)}
.top .tm{margin-left:auto;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
@media (max-width:560px){.top .tm{display:none}}

.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:8px;padding:14px 26px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem}
.btn-gold{background:var(--gold);color:var(--on-gold)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);letter-spacing:.04em;text-transform:none;padding:10px 18px}
.btn-ghost:hover{border-color:var(--brand)}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}

/* landing */
.landing{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-block:28px 12px}
.landing > *{min-width:0}
.rule{width:56px;height:3px;background:var(--gold);margin:18px 0 22px}
.hero-h{font-size:clamp(2.1rem,5.2vw,3.6rem);font-weight:800;letter-spacing:-.02em;color:var(--brand-deep)}
.hero-h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;color:var(--brand);margin-top:10px}
:root[data-theme="dark"] .hero-h{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-h{color:var(--ink)}}
.lede{color:var(--ink-2);margin-top:18px;max-width:52ch}
.six{font-weight:700;color:var(--brand);font-size:1.15rem;margin-top:14px}
.cta-row{margin-top:26px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.fine{font-size:.9rem;color:var(--ink-2)}
@media (max-width:820px){.landing{grid-template-columns:1fr;gap:32px}}

/* desk scene: fixed "photographed desk" look in both themes; intro card sits in front */
.desk{--ink:#0d3b55;--ink-2:#3d5f73;--brand:#00668f;--brand-deep:#0b4664;--gold:#c9a24a;--on-gold:#0b3a52;
  position:relative;overflow:hidden;border-radius:20px;margin-top:6px;color:var(--ink);
  background:radial-gradient(120% 90% at 75% 40%,#fbf8f1 0%,#f1ebdf 55%,#e6dece 100%);
  min-height:660px;display:flex;align-items:center;padding:40px clamp(18px,4vw,48px);
  box-shadow:inset 0 0 120px rgba(120,95,50,.12)}
.desk::before{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background:repeating-linear-gradient(97deg,rgba(150,120,70,.05) 0 2px,transparent 2px 9px)}
.scene{position:absolute;inset:0;pointer-events:none}
.notebook{position:absolute;top:-78px;left:45%;width:330px;transform:rotate(-6deg);filter:drop-shadow(-6px 18px 16px rgba(30,25,15,.45)) drop-shadow(0 3px 3px rgba(30,25,15,.3))}

/* specimen record card on landing */

.qcard{background:var(--surface);border-radius:18px;padding:30px clamp(18px,4vw,48px) 34px;box-shadow:0 18px 40px -26px rgba(11,70,100,.45);max-width:820px;margin:0 auto;border:1px solid var(--line)}

.opt{display:flex;align-items:center;gap:18px;width:100%;text-align:left;background:var(--surface-2);border:1.5px solid transparent;border-radius:10px;padding:11px 16px;transition:background .15s,border-color .15s,transform .15s}

.opt.on .k{background:var(--brand);color:var(--on-brand)}

.qnav{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:0 auto}

.slide-in-r{animation:inR .42s cubic-bezier(.2,.8,.2,1) both}
.slide-in-l{animation:inL .42s cubic-bezier(.2,.8,.2,1) both}
.slide-out-l{animation:outL .32s ease-in both;position:absolute;inset:6px 4px auto 4px}
.slide-out-r{animation:outR .32s ease-in both;position:absolute;inset:6px 4px auto 4px}
@keyframes inR{from{transform:translateX(60%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-60%);opacity:0}to{transform:none;opacity:1}}
@keyframes outL{to{transform:translateX(-70%);opacity:0}}
@keyframes outR{to{transform:translateX(70%);opacity:0}}

function quizShell(){
  app.innerHTML = `
  <div class="progress-row"><span>Progress</span><span id="pc" class="mono"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="stage" id="stage"></div>
  <div class="qnav"><button class="btn btn-ghost" id="back"><span aria-hidden="true">&larr;</span> Back</button><span class="hint">Select an answer to continue</span></div>`;
  document.getElementById("back").onclick = goBack;
  renderQ("r", true);
}

function cardHTML(i){
  const q = Q[i];
  return `<div class="qcard" role="group" aria-labelledby="qh${i}">
    <div class="eyebrow">Question ${i+1}</div>
    <h2 id="qh${i}">${esc(q.q)}</h2>
    <p class="sub">${esc(q.s)}</p>
    <div class="opts">${q.o.map((o,j)=>`<button class="opt${answers[i]===j?" on":""}" data-j="${j}"><span class="k">${"ABCDEF"[j]}</span><span>${esc(o[1])}</span></button>`).join("")}</div>
  </div>`;
}

function renderQ(dir, first){
  const stage = document.getElementById("stage");
  const old = stage.firstElementChild;
  const el = document.createElement("div");
  el.innerHTML = cardHTML(idx);
  const card = el.firstElementChild;
  if(old && !first){
    old.className = old.className.replace(/slide-\S+/g,"") + (dir==="r" ? " slide-out-l" : " slide-out-r");
    setTimeout(()=>old.remove(), 330);
  }
  card.classList.add(dir==="r" ? "slide-in-r" : "slide-in-l");
  stage.appendChild(card);
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.j, b));
  document.getElementById("pc").textContent = `${idx+1} of ${Q.length}`;
  document.getElementById("pb").style.width = `${((idx+1)/Q.length)*100}%`;
  const back = document.getElementById("back");
  back.style.visibility = "visible";
  back.setAttribute("aria-label", idx===0 ? "Back to start" : "Previous question");
}

function pick(j, btn){
  if(busy) return;
  busy = true;
  answers[idx] = j;
  btn.parentElement.querySelectorAll(".opt").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on","flash");
  setTimeout(()=>{
    busy = false;
    if(idx < Q.length-1){ idx++; renderQ("r"); }
    else { result = classify(); stickerStep = 1; stickerData = {}; showResult(result); }
  }, 480);
}
function goBack(){
  if(busy) return;
  if(idx===0){ landing(); return; }
  idx--; renderQ("l");
}

function classify(){
  const score = {C:0,M:0,K:0,S:0,V:0,F:0}, last = {};
  answers.forEach((a,i)=>{ if(a===null) return; const t = Q[i].o[a][0]; score[t]++; last[t]=i; });
  const max = Math.max(...Object.values(score));
  const tied = ORDER.filter(t=>score[t]===max);
  tied.sort((a,b)=>(last[b]??-1)-(last[a]??-1)); // tie: most recently chosen personality wins
  return tied[0];
}

  return `Essential Character&trade; by GHY International. The personality classification is a creative campaign concept inspired by tariff classification. The product code above is an illustrative reference for ${esc(p.img.toLowerCase())} and is not a CBP ruling or a legal classification of the quiz taker.`;
}

        <small class="g" style="margin-top:12px">Trade superpower</small><b style="font-size:1.05rem">${p.power.toUpperCase()}</b><i>${esc(p.belief)}</i></div>

      </div>
      <p class="fine" style="margin-top:8px">Share graphic preview. What's your trade personality? Take the quiz &rarr;</p>

  </div>`;
}

function wireSticker(p){
  const box = document.getElementById("sticker");
  const rerender = () => { box.innerHTML = stickerHTML(p); wireSticker(p); };
  const f1 = document.getElementById("f1");
  if(f1) f1.addEventListener("submit", e => {
    e.preventDefault();
    const em = document.getElementById("em").value.trim(), co = document.getElementById("co").value.trim();
    const err = document.getElementById("e1");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ err.textContent="Enter a valid work email, for example name@company.com."; err.hidden=false; return; }
    if(!co){ err.textContent="Enter your company name."; err.hidden=false; return; }
    stickerData = {em,co}; stickerStep = 2; rerender();
    document.getElementById("nm").focus();
  });
  const f2 = document.getElementById("f2");
  if(f2){
    document.getElementById("b2").onclick = () => { stickerStep = 1; rerender(); };
    f2.addEventListener("submit", e => {
      e.preventDefault();
      const miss = [["nm","your full name"],["jt","your job title"],["ad","your mailing address"]].find(([id])=>!document.getElementById(id).value.trim());
      const err = document.getElementById("e2");
      if(miss){ err.textContent=`Enter ${miss[1]}.`; err.hidden=false; document.getElementById(miss[0]).focus(); return; }
      stickerStep = 3; rerender();
      box.scrollIntoView({behavior:"smooth",block:"start"});
    });
  }
  const sh = document.getElementById("sh");
  if(sh) sh.onclick = () => { document.getElementById("sharecard").hidden = false; };
  const ex = document.getElementById("ex");
  if(ex) ex.onclick = indexPage;
}
