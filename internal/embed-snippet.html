<!-- Paste into the ghy.com quiz page (Custom HTML block). The quiz sizes itself, so the page has no inner scrollbar. -->
<iframe id="ec-quiz" src="https://ghy-maria.github.io/ghy-trade-personality-quiz/" title="Essential Character Trade Personality Quiz" width="100%" height="760" scrolling="no" frameborder="0" allow="clipboard-write; web-share" style="display:block;width:100%;border:0;overflow:hidden"></iframe>
<script>
addEventListener("message",function(e){
  if(e.origin!=="https://ghy-maria.github.io"||!e.data) return;
  var f=document.getElementById("ec-quiz");
  if(e.data.ecHeight) f.style.height=e.data.ecHeight+"px";
  if(e.data.ecTop){
    var t=f.getBoundingClientRect().top;
    /* Change 0 to your sticky header height if the site has one. */
    if(t<0||t>innerHeight*0.25) scrollTo({top:scrollY+t-0,behavior:"auto"});
  }
});
</script>
